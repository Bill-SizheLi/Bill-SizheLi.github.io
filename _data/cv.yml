- title: Research Experience
  type: time_table
  contents:
    - title: Prediction-Specific Design of Learning-Augmented Algorithms
      institution: CUHK-Shenzhen
      year: Feb. 2024 – May 2025
      description:
        - Supervised by Prof. Tongxin Li and Prof. Nicolas Christianson.
        - Proposed a prediction-specific framework for learning-augmented algorithms and introduced strong optimality capturing Pareto trade-offs between consistency and robustness.
        - Developed a bi-level optimization framework and designed provably strongly optimal algorithms for deterministic/randomized ski rental and one-max search.
    - title: Optimal Tradeoff in Learning-Augmented Non-Clairvoyant Scheduling
      institution: CUHK-Shenzhen
      year: Jun. 2025 – Present
      description:
        - Ongoing work on consistency–robustness trade-offs in n-job scheduling.
        - Established refined near-optimal bounds improving upon Wei & Zhang (2020).

